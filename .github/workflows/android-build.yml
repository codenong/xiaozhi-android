name: Android CI Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Sherpa-ONNX AAR and package KWS model zip
        run: |
          mkdir -p app/libs build/kws-dist
          curl -fL "https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.2/sherpa-onnx-2.0.2.aar" \
            -o app/libs/sherpa-onnx-2.0.2.aar

          curl -fL "https://github.com/k2-fsa/sherpa-onnx/releases/download/kws-models/sherpa-onnx-kws-zipformer-zh-en-3M-2025-12-20.tar.bz2" \
            -o /tmp/kws-model.tar.bz2
          tar -xf /tmp/kws-model.tar.bz2 -C /tmp
          MODEL_DIR="/tmp/sherpa-onnx-kws-zipformer-zh-en-3M-2025-12-20"
          cp "$(ls $MODEL_DIR/encoder-*.int8.onnx | head -n 1)" build/kws-dist/encoder.onnx
          cp "$(ls $MODEL_DIR/decoder-*.onnx | head -n 1)" build/kws-dist/decoder.onnx
          cp "$(ls $MODEL_DIR/joiner-*.int8.onnx | head -n 1)" build/kws-dist/joiner.onnx
          cp "$MODEL_DIR/tokens.txt" build/kws-dist/tokens.txt
          (cd build/kws-dist && zip -r ../../kws-model.zip encoder.onnx decoder.onnx joiner.onnx tokens.txt)

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          XIAOZHI_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          XIAOZHI_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          XIAOZHI_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/release.jks
            export XIAOZHI_KEYSTORE_FILE="release.jks"
            gradle assembleRelease --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi-android-apk
          path: app/build/outputs/apk/*/*.apk

      - name: Upload KWS Model Zip (for Cloudflare Pages)
        uses: actions/upload-artifact@v4
        with:
          name: kws-model-zip
          path: kws-model.zip
